# turntable.toml -- a puck pushed from the rim toward the center of a
# spinning disc, with a twelve-member ring launched toward the center.
#
# A run file is the complete, self-contained description of one run
# (design 8). The preset fills what is left out: the rate (33 1/3 rpm),
# the length scale (the disc's radius, 0.30 m), no force. Quantities are
# strings with units; a bare number is in the run's natural units.

schema = 1

[frame]
preset = "turntable"

[[launch]]
position = ["0.27 m", "0 m", "0 m"]       # E, N, U from the center
velocity = ["-0.50 m/s", "0 m/s", "0 m/s"]   # toward the center
label = "puck"

[ring]                                    # the cyclone cartoon (G4)
count = 12
radius = "0.15 m"
speed = "0.30 m/s"
sense = "inward"

[run]
duration = "3 s"
stop = "leaves"
samples = 600
